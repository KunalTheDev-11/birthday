<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Mom!</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        /* 3D Card Flip CSS */
        .perspective {
            perspective: 1000px;
        }
        
        .card-inner {
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        
        .card-front, .card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        
        .card-back {
            transform: rotateY(180deg);
        }

        /* Bouncing Animation for Start Button */
        @keyframes bounce-soft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce-soft {
            animation: bounce-soft 2s infinite;
        }

        /* Smooth Screen Transitions */
        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }
        .screen.active {
            display: flex;
            opacity: 1;
        }

        /* Shake animation for incorrect matches */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .shake {
            animation: shake 0.4s;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-200 via-purple-100 to-pink-200 min-h-screen overflow-hidden text-slate-800 selection:bg-pink-300">

    <!-- SCREEN 1: Landing Page -->
    <div id="screen-landing" class="screen active flex-col items-center justify-center min-h-screen px-4 text-center">
        <div class="mb-8 relative">
            <!-- Decorative background blob -->
            <div class="absolute inset-0 bg-white/40 blur-3xl rounded-full scale-150 -z-10"></div>
            
            <h1 class="text-6xl md:text-8xl font-bold text-pink-500 drop-shadow-sm mb-4 leading-tight">
                Happy<br>Birthday<br>Mom!
            </h1>
            <p class="text-xl md:text-2xl text-purple-700 font-medium">
                Ready to find your gift? 🎁
            </p>
        </div>

        <button onclick="startGame()" class="animate-bounce-soft bg-gradient-to-r from-pink-500 to-purple-500 text-white text-2xl font-bold py-4 px-10 rounded-full shadow-[0_8px_0_#9d174d] hover:brightness-110 active:shadow-[0_0px_0_#9d174d] active:translate-y-2 transition-all">
            Start Game
        </button>
    </div>

    <!-- SCREEN 2: The Game -->
    <div id="screen-game" class="screen flex-col items-center justify-start min-h-screen py-10 px-4 w-full">
        
        <div class="text-center mb-6 w-full max-w-md">
            <h2 class="text-3xl font-bold text-purple-800 mb-2">Match the pairs!</h2>
            <p class="text-pink-600 font-medium text-lg">Find them all to reveal your surprise.</p>
            <div class="mt-4 flex justify-between px-2 text-purple-700 font-bold bg-white/50 rounded-lg py-2 backdrop-blur-sm">
                <span>Moves: <span id="move-counter">0</span></span>
                <span>Matches: <span id="match-counter">0</span>/6</span>
            </div>
        </div>

        <!-- Game Grid Container -->
        <div id="game-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-3 md:gap-4 w-full max-w-md mx-auto perspective">
            <!-- Cards will be injected here by JavaScript -->
        </div>
    </div>

    <!-- SCREEN 3: Win Reveal -->
    <div id="screen-win" class="screen flex-col items-center justify-center min-h-screen px-6 text-center">
        <div class="bg-white/80 backdrop-blur-md p-8 md:p-12 rounded-3xl shadow-xl border-4 border-white max-w-lg w-full relative overflow-hidden">
            
            <!-- Confetti Popper Emoji -->
            <div class="text-6xl md:text-8xl mb-6">🎉</div>
            
            <h2 class="text-4xl md:text-5xl font-bold text-pink-600 mb-6 drop-shadow-sm">
                You did it!
            </h2>
            
            <div class="bg-purple-100 rounded-2xl p-6 mb-8 border-2 border-purple-200">
                <p class="text-xl md:text-2xl text-purple-900 leading-relaxed font-medium">
                    Your gift is hidden in the <strong class="text-pink-600 font-bold">Blanket Fort</strong> under the string lights! ⛺✨
                </p>
            </div>
            
            <p class="text-2xl font-bold text-slate-700 mt-4">
                Love, <span class="text-pink-500">Kunal ❤️</span>
            </p>
        </div>
    </div>

    <script>
        // --- State Variables ---
        const emojis = ['🎂', '🎁', '🎈', '🍫', '💐', '👑'];
        let cardsArray = [...emojis, ...emojis]; // Duplicate for pairs (12 total)
        let firstCard = null;
        let secondCard = null;
        let lockBoard = false;
        let matchedPairs = 0;
        let moves = 0;

        // --- DOM Elements ---
        const screenLanding = document.getElementById('screen-landing');
        const screenGame = document.getElementById('screen-game');
        const screenWin = document.getElementById('screen-win');
        const gameGrid = document.getElementById('game-grid');
        const moveCounter = document.getElementById('move-counter');
        const matchCounter = document.getElementById('match-counter');

        // --- Functions ---

        // Switch visible screens
        function switchScreen(targetScreen) {
            // Hide all
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active');
                setTimeout(() => s.style.display = 'none', 400); // Wait for fade out
            });

            // Show target
            setTimeout(() => {
                targetScreen.style.display = 'flex';
                // Force reflow
                void targetScreen.offsetWidth;
                targetScreen.classList.add('active');
            }, 50);
        }

        // Shuffle Array (Fisher-Yates)
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Start Game Initialization
        function startGame() {
            switchScreen(screenGame);
            
            // Reset state
            matchedPairs = 0;
            moves = 0;
            firstCard = null;
            secondCard = null;
            lockBoard = false;
            
            moveCounter.innerText = moves;
            matchCounter.innerText = matchedPairs;
            gameGrid.innerHTML = '';

            // Shuffle and create cards
            shuffle(cardsArray);

            cardsArray.forEach((emoji, index) => {
                const cardElement = document.createElement('div');
                cardElement.classList.add('card', 'relative', 'w-full', 'aspect-[3/4]', 'cursor-pointer');
                cardElement.dataset.emoji = emoji;
                
                cardElement.innerHTML = `
                    <div class="card-inner absolute w-full h-full rounded-xl shadow-md border-2 border-white/50">
                        <!-- Card Front (Cover) -->
                        <div class="card-front absolute w-full h-full bg-pink-400 rounded-xl flex items-center justify-center text-4xl bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9IiNmZmYiIGZpbGwtb3BhY2l0eT0iMC4yIi8+PC9zdmc+')]">
                            <span class="text-white opacity-80 drop-shadow-md">?</span>
                        </div>
                        <!-- Card Back (Emoji) -->
                        <div class="card-back absolute w-full h-full bg-white rounded-xl flex items-center justify-center text-5xl sm:text-6xl drop-shadow-lg">
                            ${emoji}
                        </div>
                    </div>
                `;

                cardElement.addEventListener('click', flipCard);
                gameGrid.appendChild(cardElement);
            });
        }

        // Handle Card Flips
        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flipped');

            if (!firstCard) {
                // First click
                firstCard = this;
                return;
            }

            // Second click
            secondCard = this;
            moves++;
            moveCounter.innerText = moves;
            
            checkForMatch();
        }

        // Check if cards match
        function checkForMatch() {
            let isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        // If they match, leave them flipped and update score
        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            
            matchedPairs++;
            matchCounter.innerText = matchedPairs;

            resetBoard();

            // Check Win Condition
            if (matchedPairs === (cardsArray.length / 2)) {
                setTimeout(winGame, 600);
            }
        }

        // If they don't match, flip them back after a delay
        function unflipCards() {
            lockBoard = true;

            // Optional: add a little shake effect to the cards
            firstCard.classList.add('shake');
            secondCard.classList.add('shake');

            setTimeout(() => {
                firstCard.classList.remove('flipped', 'shake');
                secondCard.classList.remove('flipped', 'shake');
                resetBoard();
            }, 1000);
        }

        // Reset turn state
        function resetBoard() {
            [firstCard, secondCard] = [null, null];
            lockBoard = false;
        }

        // Trigger Win Sequence
        function winGame() {
            switchScreen(screenWin);
            fireConfetti();
        }

        // Spectacular Confetti Animation
        function fireConfetti() {
            const duration = 5 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);
                // Launch from both sides
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } 
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } 
                }));
            }, 250);

            // Initial big burst from the center
            setTimeout(() => {
                confetti({
                    particleCount: 150,
                    spread: 100,
                    origin: { y: 0.6 },
                    colors: ['#f472b6', '#c084fc', '#fcd34d', '#34d399', '#ef4444'],
                    zIndex: 100
                });
            }, 300);
        }
    </script>
</body>
</html>

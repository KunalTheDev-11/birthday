<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Mom!</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Canvas Confetti for the massive explosion -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Fun, playful Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for cute icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            overflow: hidden; /* Prevent scrollbars during animations */
            touch-action: manipulation;
        }

        /* Bouncy Animation for Cake & Buttons */
        .bouncy {
            animation: bounce 2s infinite ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Kit Kat Cake CSS Construction */
        .kitkat-cake-base {
            background-color: #e53935; /* Kit Kat Red */
            background-image: repeating-linear-gradient(
                90deg, 
                transparent, 
                transparent 25px, 
                rgba(0,0,0,0.3) 25px, 
                rgba(0,0,0,0.3) 30px
            );
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.4), 0 15px 25px rgba(0,0,0,0.2);
        }
        
        /* Candle Flame Animation */
        .flame {
            animation: flicker 0.5s infinite alternate;
            box-shadow: 0 0 20px #fbbf24, 0 0 40px #f59e0b;
        }
        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
            100% { transform: scale(1.1) rotate(2deg); opacity: 1; }
        }

        /* Squishy Button Effect */
        .btn-squish {
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-squish:active {
            transform: scale(0.92) translateY(4px);
            box-shadow: 0 0px 0px rgba(0,0,0,0.2);
        }

        /* Blanket Fort String Lights */
        .string-lights {
            position: absolute;
            top: -20px;
            left: 0;
            width: 100%;
            height: 150px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
            z-index: 40;
        }
        .fort-mode-active .string-lights {
            opacity: 1;
        }
        .wire {
            position: absolute;
            top: 40px;
            left: -10%;
            width: 120%;
            height: 80px;
            border-bottom: 2px solid #333;
            border-radius: 50%;
        }
        .bulb {
            position: absolute;
            width: 16px;
            height: 24px;
            border-radius: 50% 50% 30% 30%;
            background: #fcd34d;
            box-shadow: 0 0 20px 8px rgba(252, 211, 77, 0.6);
            animation: glow 1.5s infinite alternate;
        }
        .bulb::before {
            content: ''; position: absolute;
            top: -6px; left: 4px; width: 8px; height: 6px;
            background: #222; border-radius: 2px;
        }
        @keyframes glow {
            0% { opacity: 0.6; box-shadow: 0 0 10px 4px rgba(252, 211, 77, 0.4); }
            100% { opacity: 1; box-shadow: 0 0 25px 10px rgba(252, 211, 77, 0.8); }
        }

        /* Domino Animation */
        #domino-track {
            perspective: 1000px;
        }
        .domino-piece {
            width: 30px;
            height: 80px;
            border-radius: 4px;
            transform-origin: bottom right;
            transition: transform 0.4s cubic-bezier(0.5, 0, 0.8, 0.2);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            display: inline-block;
            margin: 0 5px;
        }
        .domino-piece.fall {
            transform: rotate(75deg);
        }

        /* Safari Animations */
        .jeep {
            animation: driveAcross 4s linear forwards;
        }
        .tiger {
            animation: popUpTiger 3s ease-in-out forwards;
        }
        @keyframes driveAcross {
            0% { transform: translateX(-150px) rotate(-2deg); }
            20% { transform: translateX(20vw) rotate(1deg); }
            40% { transform: translateX(50vw) rotate(-1deg); }
            60% { transform: translateX(80vw) rotate(2deg); }
            100% { transform: translateX(120vw) rotate(0deg); }
        }
        @keyframes popUpTiger {
            0% { transform: translateY(150px) scale(0.5); opacity: 0; }
            20% { transform: translateY(0) scale(1.2) rotate(-10deg); opacity: 1; }
            25% { transform: translateY(0) scale(1) rotate(10deg); }
            30% { transform: translateY(0) scale(1.1) rotate(0deg); }
            80% { transform: translateY(0) scale(1.1); opacity: 1; }
            100% { transform: translateY(150px) scale(0.5); opacity: 0; }
        }
    </style>
</head>

<body class="antialiased">
    
    <!-- Main App Wrapper (handles theme changes) -->
    <div id="app" class="relative w-full h-screen bg-pink-100 text-slate-800 transition-colors duration-1000 flex flex-col items-center justify-between py-10 px-4">
        
        <!-- String Lights (Hidden by default, shown in Fort Mode) -->
        <div class="string-lights">
            <div class="wire">
                <div class="bulb top-[76px] left-[10%]" style="animation-delay: 0s; transform: rotate(-10deg)"></div>
                <div class="bulb top-[80px] left-[30%]" style="animation-delay: 0.5s; transform: rotate(5deg)"></div>
                <div class="bulb top-[78px] left-[50%]" style="animation-delay: 0.2s; transform: rotate(-5deg)"></div>
                <div class="bulb top-[80px] left-[70%]" style="animation-delay: 0.7s; transform: rotate(10deg)"></div>
                <div class="bulb top-[76px] left-[90%]" style="animation-delay: 0.4s; transform: rotate(-8deg)"></div>
            </div>
        </div>

        <!-- Header -->
        <div class="text-center z-10 mt-8">
            <h1 id="mainTitle" class="text-5xl md:text-7xl font-bold text-pink-500 drop-shadow-md mb-2 transition-colors duration-1000">
                Happy Birthday!
            </h1>
            <p id="subTitle" class="text-xl md:text-2xl font-semibold text-slate-600 transition-colors duration-1000">
                To the funnest Mom ever 💖
            </p>
        </div>

        <!-- Center: CSS Kit Kat Cake & Big Button -->
        <div class="flex flex-col items-center z-10 mt-10">
            
            <!-- CSS Cake -->
            <div class="relative w-64 h-40 bouncy mb-12">
                <!-- Cake Base (Kit Kats) -->
                <div class="absolute bottom-0 w-full h-32 kitkat-cake-base rounded-xl border-4 border-[#b71c1c]"></div>
                
                <!-- Chocolate Top Layer -->
                <div class="absolute top-4 left-0 w-full h-16 bg-[#4e342e] rounded-[50%] border-4 border-[#3e2723] shadow-inner flex items-center justify-center overflow-hidden">
                    <!-- Colorful Gems/M&Ms on top -->
                    <div class="absolute w-5 h-5 rounded-full bg-blue-400 border-2 border-blue-600 top-2 left-12 transform rotate-12"></div>
                    <div class="absolute w-5 h-5 rounded-full bg-yellow-400 border-2 border-yellow-600 top-8 left-24 transform -rotate-12"></div>
                    <div class="absolute w-5 h-5 rounded-full bg-green-400 border-2 border-green-600 top-4 right-16"></div>
                    <div class="absolute w-5 h-5 rounded-full bg-purple-400 border-2 border-purple-600 top-7 right-8 transform rotate-45"></div>
                </div>

                <!-- Candle -->
                <div class="absolute -top-10 left-1/2 -translate-x-1/2 w-4 h-16 bg-white border-2 border-slate-300 rounded-sm">
                    <div class="w-full h-full bg-repeating-linear-gradient(45deg, transparent, transparent 5px, text-red-500 5px, text-red-500 10px)"></div>
                    <!-- Flame -->
                    <div class="absolute -top-8 -left-1 w-6 h-8 bg-yellow-400 rounded-[50%_50%_50%_50%_/_60%_60%_40%_40%] flame"></div>
                </div>
            </div>

            <!-- Big Confetti Button -->
            <button id="confettiBtn" class="btn-squish bg-gradient-to-r from-pink-400 to-purple-500 text-white font-bold text-2xl py-4 px-10 rounded-full shadow-[0_8px_0_#9d174d] hover:brightness-110 active:shadow-[0_0px_0_#9d174d] flex items-center gap-3 border-4 border-white">
                <span>Make a Wish!</span> 
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </button>
        </div>

        <!-- Fun Modes Control Panel -->
        <div class="w-full max-w-2xl bg-white/50 backdrop-blur-sm rounded-3xl p-4 shadow-lg border-2 border-white z-20 flex flex-wrap justify-center gap-3 md:gap-6 mb-4 transition-colors duration-1000" id="controlPanel">
            
            <button id="btnFort" class="btn-squish flex-1 min-w-[120px] bg-indigo-500 text-white rounded-2xl py-3 px-2 font-semibold shadow-[0_6px_0_#3730a3] flex flex-col items-center justify-center gap-1 border-2 border-indigo-300 hover:bg-indigo-400 active:shadow-none">
                <i class="fa-solid fa-campground text-xl mb-1"></i>
                <span class="text-sm md:text-base leading-tight">Blanket Fort</span>
            </button>

            <button id="btnDomino" class="btn-squish flex-1 min-w-[120px] bg-emerald-500 text-white rounded-2xl py-3 px-2 font-semibold shadow-[0_6px_0_#065f46] flex flex-col items-center justify-center gap-1 border-2 border-emerald-300 hover:bg-emerald-400 active:shadow-none">
                <i class="fa-solid fa-cubes text-xl mb-1"></i>
                <span class="text-sm md:text-base leading-tight">Dominoes</span>
            </button>

            <button id="btnSafari" class="btn-squish flex-1 min-w-[120px] bg-amber-500 text-white rounded-2xl py-3 px-2 font-semibold shadow-[0_6px_0_#b45309] flex flex-col items-center justify-center gap-1 border-2 border-amber-300 hover:bg-amber-400 active:shadow-none">
                <i class="fa-solid fa-binoculars text-xl mb-1"></i>
                <span class="text-sm md:text-base leading-tight">Jim Corbett</span>
            </button>
        </div>

        <!-- Domino Track Overlay -->
        <div id="dominoOverlay" class="fixed inset-0 pointer-events-none hidden flex items-center justify-center z-30 overflow-hidden">
            <div id="domino-track" class="flex items-end justify-center w-full px-4 pt-40">
                <!-- Domino pieces injected by JS -->
            </div>
        </div>

        <!-- Safari Overlay -->
        <div id="safariOverlay" class="fixed bottom-32 left-0 w-full h-40 pointer-events-none hidden z-30 overflow-hidden">
            <div class="relative w-full h-full">
                <!-- Trees/Bushes -->
                <div class="absolute bottom-0 left-[20%] text-5xl">🌴</div>
                <div class="absolute bottom-0 left-[60%] text-6xl">🌲</div>
                <div class="absolute bottom-0 left-[80%] text-4xl">🌿</div>
                
                <!-- Animated Elements -->
                <div class="tiger absolute bottom-2 left-[50%] text-7xl z-10">🐅</div>
                <div class="jeep absolute bottom-0 left-0 text-7xl z-20 drop-shadow-xl">🚙</div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const app = document.getElementById('app');
        const title = document.getElementById('mainTitle');
        const subtitle = document.getElementById('subTitle');
        const panel = document.getElementById('controlPanel');
        
        const btnConfetti = document.getElementById('confettiBtn');
        const btnFort = document.getElementById('btnFort');
        const btnDomino = document.getElementById('btnDomino');
        const btnSafari = document.getElementById('btnSafari');

        let isFortMode = false;

        // 1. Massive Confetti Button
        btnConfetti.addEventListener('click', () => {
            // Create a massive explosion
            const duration = 3 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);
                // Fire from multiple spots
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
            
            // Middle big burst
            confetti({
                particleCount: 200,
                spread: 100,
                origin: { y: 0.6 },
                colors: ['#f472b6', '#c084fc', '#fcd34d', '#34d399', '#ef4444'],
                zIndex: 100
            });
        });

        // 2. Blanket Fort Mode
        btnFort.addEventListener('click', () => {
            isFortMode = !isFortMode;
            
            if(isFortMode) {
                // Dark theme
                app.classList.remove('bg-pink-100');
                app.classList.add('bg-slate-900', 'fort-mode-active');
                
                title.classList.remove('text-pink-500');
                title.classList.add('text-amber-300');
                
                subtitle.classList.remove('text-slate-600');
                subtitle.classList.add('text-slate-300');
                
                panel.classList.remove('bg-white/50', 'border-white');
                panel.classList.add('bg-slate-800/80', 'border-slate-700');
            } else {
                // Light Theme
                app.classList.add('bg-pink-100');
                app.classList.remove('bg-slate-900', 'fort-mode-active');
                
                title.classList.add('text-pink-500');
                title.classList.remove('text-amber-300');
                
                subtitle.classList.add('text-slate-600');
                subtitle.classList.remove('text-slate-300');
                
                panel.classList.add('bg-white/50', 'border-white');
                panel.classList.remove('bg-slate-800/80', 'border-slate-700');
            }
        });

        // 3. Domino Effect Mode
        btnDomino.addEventListener('click', () => {
            const overlay = document.getElementById('dominoOverlay');
            const track = document.getElementById('domino-track');
            
            // Reset
            track.innerHTML = '';
            overlay.classList.remove('hidden');
            
            // Colors for dominoes
            const colors = ['#ef4444', '#f97316', '#f59e0b', '#84cc16', '#10b981', '#06b6d4', '#3b82f6', '#8b5cf6', '#d946ef', '#f43f5e'];
            
            // Calculate how many fit based on screen width
            const screenWidth = window.innerWidth;
            const numDominoes = Math.min(Math.floor(screenWidth / 45), 25); 

            // Create dominoes
            for(let i = 0; i < numDominoes; i++) {
                let dom = document.createElement('div');
                dom.className = 'domino-piece';
                dom.style.backgroundColor = colors[i % colors.length];
                track.appendChild(dom);
                
                // Trigger fall animation sequentially
                setTimeout(() => {
                    dom.classList.add('fall');
                    // Mini confetti pop when hitting the ground
                    if (i % 3 === 0) {
                        const rect = dom.getBoundingClientRect();
                        const x = (rect.left + rect.width / 2) / window.innerWidth;
                        const y = (rect.bottom) / window.innerHeight;
                        confetti({
                            particleCount: 15,
                            spread: 40,
                            origin: { x, y },
                            colors: [colors[i % colors.length]],
                            zIndex: 40
                        });
                    }
                }, i * 120); // 120ms delay between falls
            }

            // Hide overlay after animation finishes
            setTimeout(() => {
                overlay.classList.add('hidden');
                track.innerHTML = '';
            }, (numDominoes * 120) + 1000);
        });

        // 4. Safari Mode
        btnSafari.addEventListener('click', () => {
            const overlay = document.getElementById('safariOverlay');
            
            // Remove hidden to play CSS animations
            overlay.classList.remove('hidden');
            
            // Hide again after animation completes (approx 4 seconds)
            setTimeout(() => {
                overlay.classList.add('hidden');
                // Force reflow to reset animation for next click
                void overlay.offsetWidth; 
            }, 4500);
        });

    </script>
</body>
</html>

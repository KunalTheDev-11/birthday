<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Mom - Special Surprise</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Google Fonts: Nunito (Mobile/Playful) and Playfair Display (TV/Elegant) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">

    <style>
        /* Base Defaults (Mobile Theme) */
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            color: #4a5568;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }

        h1, h2, h3 {
            color: #d53f8c; /* Pink-600 */
        }

        /* 3D Card Flip CSS */
        .perspective { perspective: 1000px; }
        .card-inner {
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .card-back { transform: rotateY(180deg); }

        /* Card Themes (Mobile Default) */
        .card-front-theme {
            background: linear-gradient(135deg, #f687b3, #fbb6ce);
            border: 4px solid white;
            border-radius: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card-back-theme {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* Input / Button Mobile Themes */
        .input-theme {
            background: white;
            border: 2px solid #fbb6ce;
            border-radius: 1rem;
            color: #4a5568;
        }
        .btn-theme {
            background: linear-gradient(to right, #ed64a6, #9f7aea);
            border-radius: 9999px;
            color: white;
            box-shadow: 0 4px 14px 0 rgba(237, 100, 166, 0.39);
        }

        /* Screen Transitions */
        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .screen.active {
            display: flex;
            opacity: 1;
        }

        /* =========================================
           TV / DESKTOP THEME (min-width: 768px)
           ========================================= */
        @media (min-width: 768px) {
            body {
                font-family: 'Playfair Display', serif;
                background: linear-gradient(135deg, #0f172a 0%, #000000 100%);
                color: #e2e8f0;
            }

            h1, h2, h3 {
                color: #fbbf24; /* Amber/Gold */
                text-shadow: 0 2px 10px rgba(251, 191, 36, 0.2);
            }

            .subtitle-theme {
                color: #cbd5e1;
                font-family: 'Nunito', sans-serif; /* Keep sans for small text */
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }

            /* TV Card Theme */
            .card-front-theme {
                background: linear-gradient(135deg, #1e293b, #0f172a);
                border: 2px solid #fbbf24;
                border-radius: 0.25rem;
                box-shadow: inset 0 0 20px rgba(251, 191, 36, 0.1);
            }
            .card-front-theme::after {
                content: "❈";
                color: #fbbf24;
                opacity: 0.5;
                font-size: 2rem;
            }
            .card-front-theme .mobile-q { display: none; } /* Hide the '?' used on mobile */
            
            .card-back-theme {
                background: #1e293b;
                border: 2px solid #fbbf24;
                border-radius: 0.25rem;
                box-shadow: 0 0 20px rgba(251, 191, 36, 0.2);
            }

            /* Input / Button TV Themes */
            .input-theme {
                background: rgba(30, 41, 59, 0.8);
                border: 1px solid #fbbf24;
                border-radius: 0.25rem;
                color: white;
            }
            .btn-theme {
                background: transparent;
                border: 2px solid #fbbf24;
                border-radius: 0.25rem;
                color: #fbbf24;
                transition: all 0.3s ease;
                box-shadow: none;
            }
            .btn-theme:hover {
                background: #fbbf24;
                color: black;
                box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
            }

            /* Glassmorphism panel for TV */
            .panel-tv {
                background: rgba(15, 23, 42, 0.6);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(251, 191, 36, 0.2);
                border-radius: 0.5rem;
            }
        }
    </style>
</head>
<body class="antialiased">

    <div id="screen-setup" class="screen active flex-col items-center justify-center min-h-screen p-6">
        <div class="panel-tv max-w-md w-full bg-white/60 backdrop-blur-md p-8 rounded-3xl md:rounded-none shadow-xl text-center">
            <h1 class="text-3xl md:text-4xl font-bold mb-6">Party Setup</h1>
            
            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-sm font-bold mb-1 subtitle-theme">Countdown Time (Minutes)</label>
                    <input type="number" id="setup-minutes" value="5" min="1" class="input-theme w-full p-3 focus:outline-none focus:ring-2 focus:ring-pink-400 md:focus:ring-yellow-400">
                </div>
                
                <div>
                    <label class="block text-sm font-bold mb-1 subtitle-theme">Where is the gift hidden?</label>
                    <input type="text" id="setup-location" placeholder="e.g. Under the living room sofa" class="input-theme w-full p-3 focus:outline-none focus:ring-2 focus:ring-pink-400 md:focus:ring-yellow-400">
                </div>
                
                <button onclick="startCountdown()" class="btn-theme w-full font-bold py-4 mt-6 text-lg">
                    Begin the Surprise
                </button>
            </div>
        </div>
    </div>

    <div id="screen-countdown" class="screen flex-col items-center justify-center min-h-screen w-full">
        <div class="text-center w-full px-4">
            <h2 class="text-2xl md:text-5xl mb-4 subtitle-theme">The surprise begins in...</h2>
            
            <!-- Timer Display -->
            <div id="timer-display" class="text-7xl md:text-[15rem] font-bold tracking-tighter tabular-nums drop-shadow-lg md:drop-shadow-[0_0_40px_rgba(251,191,36,0.3)]">
                00:00
            </div>
            
            <p class="mt-8 text-lg md:text-2xl opacity-80 subtitle-theme">Get ready, Mom!</p>
        </div>
    </div>

    <div id="screen-game" class="screen min-h-screen w-full flex-col md:flex-row items-center justify-center p-4 md:p-12 gap-8 md:gap-16">
        
        <!-- Left Side (TV) / Top Side (Mobile) -->
        <div class="text-center md:text-left md:w-1/3 panel-tv p-6 rounded-2xl md:p-10 w-full max-w-sm md:max-w-none">
            <h1 class="text-4xl md:text-6xl font-bold mb-2 md:mb-6">Memory Match</h1>
            <p class="text-lg md:text-2xl mb-6 md:mb-10 subtitle-theme opacity-90">Find all the matching pairs to reveal your birthday surprise location!</p>
            
            <div class="flex justify-around md:flex-col gap-4 text-xl md:text-3xl font-bold">
                <div class="bg-white/40 md:bg-transparent px-4 py-2 rounded-xl md:p-0">
                    <span class="subtitle-theme text-sm block md:inline md:text-2xl">Moves:</span> 
                    <span id="move-counter">0</span>
                </div>
                <div class="bg-white/40 md:bg-transparent px-4 py-2 rounded-xl md:p-0">
                    <span class="subtitle-theme text-sm block md:inline md:text-2xl">Matches:</span> 
                    <span id="match-counter">0</span><span class="opacity-50 text-sm md:text-2xl">/6</span>
                </div>
            </div>
        </div>

        <!-- Right Side (TV) / Bottom Side (Mobile) -->
        <div class="md:w-2/3 w-full max-w-md md:max-w-4xl">
            <div id="game-grid" class="grid grid-cols-3 md:grid-cols-4 gap-3 md:gap-6 perspective">
                <!-- Cards injected here -->
            </div>
        </div>
    </div>

    <div id="screen-win" class="screen flex-col items-center justify-center min-h-screen p-6 text-center">
        <div class="panel-tv max-w-2xl w-full bg-white/70 backdrop-blur-xl p-10 md:p-16 rounded-3xl md:rounded-lg shadow-2xl relative z-10">
            <div class="text-6xl md:text-8xl mb-6">🎂</div>
            
            <h1 class="text-4xl md:text-7xl font-bold mb-6">Happy Birthday Mom!</h1>
            
            <p class="text-xl md:text-3xl mb-8 subtitle-theme">You successfully completed the challenge.</p>
            
            <div class="bg-white/50 md:bg-black/40 border-2 border-pink-300 md:border-yellow-500 rounded-2xl p-6 md:p-10 mb-8">
                <p class="text-lg md:text-2xl opacity-80 mb-2 subtitle-theme">Your gift is hidden at:</p>
                <p id="reveal-location" class="text-2xl md:text-4xl font-bold text-pink-600 md:text-yellow-400 uppercase tracking-wide"></p>
            </div>
            
            <p class="text-2xl md:text-4xl font-bold font-['Playfair_Display'] italic">
                Love, Kunal ❤️
            </p>
        </div>
    </div>

    <script>
        // --- State ---
        let countdownTimer;
        let giftLocationText = "";
        
        // Game State
        const emojis = ['🎁', '🎂', '🥂', '💎', '🌟', '👑'];
        let cardsArray = [...emojis, ...emojis];
        let firstCard = null;
        let secondCard = null;
        let lockBoard = false;
        let matchedPairs = 0;
        let moves = 0;

        // --- DOM Elements ---
        const sSetup = document.getElementById('screen-setup');
        const sCountdown = document.getElementById('screen-countdown');
        const sGame = document.getElementById('screen-game');
        const sWin = document.getElementById('screen-win');
        
        const timerDisplay = document.getElementById('timer-display');
        const gameGrid = document.getElementById('game-grid');
        const moveCounter = document.getElementById('move-counter');
        const matchCounter = document.getElementById('match-counter');
        const revealLocation = document.getElementById('reveal-location');

        // --- Utilities ---
        function showScreen(screenEl) {
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active');
                setTimeout(() => s.style.display = 'none', 500);
            });
            setTimeout(() => {
                screenEl.style.display = 'flex';
                void screenEl.offsetWidth; // Trigger reflow
                screenEl.classList.add('active');
            }, 550);
        }

        function startCountdown() {
            const minutes = parseInt(document.getElementById('setup-minutes').value) || 0;
            const locInput = document.getElementById('setup-location').value.trim();
            
            if (!locInput) {
                // Ensure a location is provided (using a custom UI element instead of alert)
                document.getElementById('setup-location').classList.add('border-red-500', 'animate-pulse');
                setTimeout(() => document.getElementById('setup-location').classList.remove('border-red-500', 'animate-pulse'), 2000);
                return;
            }

            giftLocationText = locInput;
            let totalSeconds = minutes * 60;

            showScreen(sCountdown);
            updateTimerDisplay(totalSeconds);

            countdownTimer = setInterval(() => {
                totalSeconds--;
                updateTimerDisplay(totalSeconds);

                if (totalSeconds <= 0) {
                    clearInterval(countdownTimer);
                    initGame();
                }
            }, 1000);
        }

        function updateTimerDisplay(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            timerDisplay.innerText = `${m}:${s}`;
        }

        function initGame() {
            showScreen(sGame);
            
            matchedPairs = 0;
            moves = 0;
            moveCounter.innerText = moves;
            matchCounter.innerText = matchedPairs;
            gameGrid.innerHTML = '';
            
            // Shuffle
            for (let i = cardsArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cardsArray[i], cardsArray[j]] = [cardsArray[j], cardsArray[i]];
            }

            // Create Cards
            cardsArray.forEach((emoji) => {
                const card = document.createElement('div');
                card.classList.add('card', 'relative', 'w-full', 'aspect-[3/4]', 'md:aspect-square', 'cursor-pointer');
                card.dataset.emoji = emoji;
                
                card.innerHTML = `
                    <div class="card-inner absolute w-full h-full">
                        <div class="card-front card-front-theme absolute w-full h-full flex items-center justify-center text-4xl">
                            <span class="mobile-q text-white opacity-80 drop-shadow-md">?</span>
                        </div>
                        <div class="card-back card-back-theme absolute w-full h-full flex items-center justify-center text-5xl md:text-7xl">
                            ${emoji}
                        </div>
                    </div>
                `;
                card.addEventListener('click', flipCard);
                gameGrid.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flipped');

            if (!firstCard) {
                firstCard = this;
                return;
            }

            secondCard = this;
            moves++;
            moveCounter.innerText = moves;
            
            checkMatch();
        }

        function checkMatch() {
            let isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            
            matchedPairs++;
            matchCounter.innerText = matchedPairs;
            resetBoard();

            if (matchedPairs === (cardsArray.length / 2)) {
                setTimeout(triggerWin, 800);
            }
        }

        function unflipCards() {
            lockBoard = true;
            
            // Shake effect
            setTimeout(() => {
                firstCard.style.transform = "translateX(-5px)";
                secondCard.style.transform = "translateX(-5px)";
                setTimeout(() => {
                    firstCard.style.transform = "translateX(5px)";
                    secondCard.style.transform = "translateX(5px)";
                }, 100);
            }, 300);

            setTimeout(() => {
                firstCard.style.transform = "";
                secondCard.style.transform = "";
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 1200);
        }

        function resetBoard() {
            [firstCard, secondCard, lockBoard] = [null, null, false];
        }

        function triggerWin() {
            revealLocation.innerText = giftLocationText;
            showScreen(sWin);
            
            // TV Confetti (Gold/Silver) vs Mobile Confetti (Colorful)
            const isDesktop = window.innerWidth >= 768;
            const colors = isDesktop ? ['#fbbf24', '#fcd34d', '#ffffff', '#94a3b8'] : ['#f472b6', '#c084fc', '#fcd34d', '#34d399', '#60a5fa'];
            
            const duration = 8 * 1000;
            const animationEnd = Date.now() + duration;

            (function frame() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return;

                const particleCount = 50 * (timeLeft / duration);
                
                confetti({
                    particleCount,
                    spread: 80,
                    origin: { x: Math.random(), y: Math.random() - 0.2 },
                    colors: colors,
                    disableForReducedMotion: true
                });
                
                requestAnimationFrame(frame);
            }());
        }
    </script>
</body>
</html>
